name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Đẩy liên tiếp lên cùng một nhánh thì chỉ chạy lần cuối.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  luat:
    name: Luật và máy chủ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # `tsc --build --force` chứ không phải `--build`: bản dịch cũ còn nằm đó
      # thì bài test mới có thể im lặng không chạy, và suite vẫn báo xanh. Đã
      # dính đúng lỗi này hai lần.
      - name: Kiểm kiểu và chạy toàn bộ test
        run: npm test

      - name: Kiểm kiểu app di động
        run: npx tsc --noEmit -p apps/mobile

  giao-dien:
    name: Giao diện chạy thật
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Build web thật, mở bằng Chromium ở kích thước điện thoại, bấm đúng như
      # người dùng bấm. `tools/screenshot.mjs` thoát khác 0 nếu có bất kỳ lỗi
      # console hay lỗi trang nào — nên đây vừa là ảnh chụp, vừa là bài kiểm
      # "app có thật sự chạy không".
      - name: Dựng bản web
        run: npm run web

      # Máy chủ chạy trước cả bài chụp màn hình, vì màn đăng nhập gọi
      # /api/auth/config ngay khi mở.
      - name: Dựng máy chủ và trang web
        run: |
          ADMIN_TOKEN=bimat-quan-tri-cho-ci RATE_LIMIT=off node apps/server/dist/index.js &
          npx serve -l 8080 -s apps/mobile/dist &
          npx wait-on -t 60000 http://127.0.0.1:8787/health http://127.0.0.1:8080

      - name: Chụp màn hình app thật
        run: node tools/screenshot.mjs

      # Hai cửa sổ trình duyệt riêng đăng ký tài khoản rồi đánh nhau. Đây là
      # bài duy nhất chứng minh được cả đường dây: tài khoản, engine ở máy chủ,
      # `view` cắt theo ghế, nước đi qua WebSocket, hai màn hình cùng đổi, và
      # kết quả vào sổ thành tích.
      - name: Hai người thật đấu nhau qua máy chủ
        run: node tools/two-players.mjs

      - name: Tải ảnh đại diện lên và phát lại
        run: node tools/avatar.mjs

      - name: Lịch sử trận — phân trang và lọc theo bộ môn
        run: node tools/history.mjs

      - name: Kết bạn, trực tuyến, tỷ thí, nhắn tin và chặn
        run: node tools/friends.mjs

      - name: Nút chat nổi, sảnh chung, thông báo hệ thống, chat phòng
        run: node tools/chat.mjs
        env:
          ADMIN_TOKEN: bimat-quan-tri-cho-ci

      - name: Cầu hoà hai chiều và đấu lại ngay trong phòng
        run: node tools/rematch.mjs

      - name: Sảnh có nhịp thở, và mời bạn vào thẳng phòng đang chờ
        run: node tools/sanh.mjs

      - name: Bảng xếp hạng đọc đúng điểm từ năm ván đánh thật
        run: node tools/bxh.mjs

      - name: Đổi mật khẩu, quản lý thiết bị, giới thiệu
        run: node tools/taikhoan.mjs

      - name: Thông báo riêng, chấm đỏ tắt đúng lúc, và báo cáo người dùng
        run: node tools/thongbao.mjs
        env:
          ADMIN_TOKEN: bimat-quan-tri-cho-ci

      # Ảnh chụp được giữ lại để soi tay. Nhiều lỗi giao diện của dự án này
      # chỉ lộ ra khi phóng to ảnh chụp, không lộ ra ở bất kỳ bài test nào.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-chup-man-hinh
          path: docs/screenshots/
          retention-days: 14
